[item-description]
tungsten-penetrator=Kinetic round for the orbital cannon. Punches through everything at ground zero, levels cliffs and leaves a crater.
orbital-strike-designator=Click a target in remote view of a planet to call in an orbital strike.\nShift + right click/drag cancels targets that have not been fired yet.
tungsten-slug=A plain cast tungsten bar for the orbital cannon. Hardly any blast, but whatever it hits takes the whole impact: the precision shot against single targets.
orbital-cluster-rod=Breaks up high above the target and rains a dozen bomblets over a wide circle. For nests spread too far apart for one penetrator.
orbital-emp-rod=A bundle of tesla charges in a tungsten shell. Little damage, but it stuns units, switches off worms and nests for a few seconds and sends tesla chain lightning through the target. The strike to open a ground assault with.
orbital-incendiary-rod=A tungsten shell packed with flamethrower fuel. It bursts on impact and sprays burning streams over a wide circle: the ground burns for a while, anything walking through catches fire, and forests burn too.
orbital-guided-rod=A tungsten slug with a seeker head and fins. It locks on to an enemy and follows it until a second before impact, leading its movement. The answer to anything that moves, demolishers included.
orbital-steel-rod=Plain steel, nothing else. The one round a platform can make for itself: iron from asteroids, steel from the furnace. Weak, but endless - the round for fire control.

