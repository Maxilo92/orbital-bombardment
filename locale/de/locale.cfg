[mod-name]
orbital-bombardment=Orbitalbombardement

[mod-description]
orbital-bombardment=Ein Orbitalgeschütz für deine Weltraumplattformen. Solange die Plattform im Orbit parkt, markierst du aus der Fernansicht Ziele überall auf dem Planeten darunter, und Wolfram-Penetratoren schlagen aus dem All ein.

[entity-name]
orbital-cannon=Orbitalgeschütz

[entity-description]
orbital-cannon=Nur auf Weltraumplattformen. Feuert, solange die Plattform im Orbit eines Planeten parkt, auf Ziele, die mit dem Orbital-Zielmarker gesetzt wurden.

