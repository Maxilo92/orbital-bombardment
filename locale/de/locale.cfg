[technology-description]
orbital-bombardment=Ein Geschütz für Weltraumplattformen, das Wolfram-Penetratoren auf jeden kartierten Punkt des Planeten darunter feuert.
orbital-cluster-munition=Ein Stab, der über dem Ziel in ein Dutzend Bomblets zerfällt.
orbital-emp-munition=Ein Stab, der beim Einschlag einen elektromagnetischen Impuls auslöst: Einheiten erstarren, Würmer und Nester fallen aus, und Kettenblitze springen von Gegner zu Gegner.
orbital-incendiary-munition=Ein Stab, der beim Einschlag brennende Strahlen über das Zielgebiet spritzt.
orbital-guided-munition=Ein Stab, der sein Ziel bis kurz vor dem Einschlag verfolgt.
orbital-fire-control=Orbitalgeschütze suchen sich selbst Ziele: Sie verteidigen deine Anlagen gegen Angreifer oder räumen Nester in deiner Verschmutzungswolke.

