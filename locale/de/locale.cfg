[item-description]
tungsten-penetrator=Kinetisches Projektil für das Orbitalgeschütz. Durchschlägt alles am Einschlagpunkt, zerstört Klippen und reißt einen Krater.
orbital-strike-designator=In der Fernansicht eines Planeten Ziel anklicken, um einen Orbitalschlag anzufordern.\nShift + Rechtsklick/-ziehen storniert Ziele, die noch nicht abgefeuert wurden.
tungsten-slug=Ein schlichter gegossener Wolframbarren für das Orbitalgeschütz. Kaum Explosion, aber die ganze Wucht trifft, was er trifft: der Präzisionsschuss gegen Einzelziele.
orbital-cluster-rod=Zerfällt hoch über dem Ziel und lässt ein Dutzend Bomblets über einen weiten Kreis regnen. Gegen Nester, die für einen Penetrator zu weit verstreut liegen.
orbital-emp-rod=Ein Bündel Tesla-Ladungen in einer Wolframhülle. Kaum Schaden, aber er lähmt Einheiten, schaltet Würmer und Nester für einige Sekunden ab und jagt Tesla-Kettenblitze durch das Ziel. Der Schlag, mit dem man einen Bodenangriff eröffnet.
orbital-incendiary-rod=Eine Wolframhülle voll Flammenwerfer-Treibstoff. Sie platzt beim Einschlag und spritzt brennende Strahlen über einen weiten Kreis: Der Boden brennt eine Weile, wer hindurchläuft, fängt Feuer, und Wälder brennen mit.
orbital-guided-rod=Ein Wolframbarren mit Suchkopf und Leitwerk. Er schaltet sich auf einen Gegner auf und verfolgt ihn bis eine Sekunde vor dem Einschlag, mit Vorhalt auf dessen Bewegung. Die Antwort auf alles, was sich bewegt, Demolisher eingeschlossen.
orbital-steel-rod=Schlichter Stahl, sonst nichts. Die eine Munition, die eine Plattform selbst herstellen kann: Eisen aus Asteroiden, Stahl aus dem Ofen. Schwach, aber unerschöpflich - die Munition für die Feuerleitung.

