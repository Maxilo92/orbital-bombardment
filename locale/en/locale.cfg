[technology-description]
orbital-bombardment=A cannon for space platforms that fires tungsten penetrators at any charted spot on the planet below.
orbital-cluster-munition=A rod that breaks up above the target into a dozen bomblets.
orbital-emp-munition=A rod that releases an electromagnetic pulse on impact: units freeze, worms and nests go down, and chain lightning jumps from enemy to enemy.
orbital-incendiary-munition=A rod that sprays burning streams over the target area on impact.
orbital-guided-munition=A rod that follows its target until shortly before impact.
orbital-fire-control=Orbital cannons pick their own targets: they defend your base against attackers or clear the nests inside your pollution cloud.

