[mod-name]
orbital-bombardment=Orbital Bombardment

[mod-description]
orbital-bombardment=An orbital cannon for your space platforms. While the platform is parked in orbit, mark targets anywhere on the planet below from remote view and tungsten penetrators come down on them from space.

[entity-name]
orbital-cannon=Orbital cannon

[entity-description]
orbital-cannon=Space platforms only. While the platform is parked in orbit of a planet, it fires at targets marked with the orbital strike designator.

[item-name]
orbital-cannon=Orbital cannon
tungsten-penetrator=Tungsten penetrator
orbital-strike-designator=Orbital strike designator
tungsten-slug=Tungsten slug
orbital-cluster-rod=Cluster rod

[item-description]
tungsten-penetrator=Kinetic round for the orbital cannon. Punches through everything at ground zero, levels cliffs and leaves a crater.
orbital-strike-designator=Click a target in remote view of a planet to call in an orbital strike.\nShift + right click/drag cancels targets that have not been fired yet.
tungsten-slug=A plain cast tungsten bar for the orbital cannon. Hardly any blast, but whatever it hits takes the whole impact: the precision shot against single targets.
orbital-cluster-rod=Breaks up high above the target and rains a dozen bomblets over a wide circle. For nests spread too far apart for one penetrator.

[ammo-category-name]
orbital-strike=Orbital strike

[shortcut-name]
give-orbital-strike-designator=Orbital strike designator

